<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Everything this page needs is local: its own bundle, the loopback backend,
      and images/blobs from them. No remote script, style, frame or form target
      is reachable, so injected markup in a chat reply or an imported web page
      has nothing to call out to. connect-src keeps both loopback spellings
      because the backend port is chosen at launch.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: http://localhost:* http://127.0.0.1:*;
      media-src 'self' data: blob:;
      connect-src 'self' http://localhost:* http://127.0.0.1:*;
      font-src 'self' data:;
      object-src 'none';
      frame-src 'self' about:;
      form-action 'none';
      base-uri 'none';
    " />
    <title>Local AI Workstation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
